<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JWI">
  <title>JWI</title>

  <!-- Fondo contrastado -->
  <rect width="64" height="64" rx="14" fill="#0B1220"/>

  <!-- Iniciales legibles -->
  <text x="10" y="40"
        font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, 'Arial Black', sans-serif"
        font-weight="900"
        font-style="italic"
        font-size="26"
        fill="#EAF2FF"
        letter-spacing="-1">JW</text>

  <!-- I como boli (acento) -->
  <g transform="translate(44 14) skewX(-10)">
    <rect x="6" y="6" width="8" height="26" rx="4" fill="#00E676"/>
    <path d="M6 32 L14 32 L10 42 Z" fill="#00E676"/>
    <rect x="8" y="8" width="2" height="18" rx="1" fill="#B9FFDA" opacity="0.6"/>
  </g>
</svg>
